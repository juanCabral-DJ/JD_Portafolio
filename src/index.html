<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Juan David Cabral | Desarrollador Frontend Angular y PrimeNG</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Portafolio de Juan David Cabral, Desarrollador Frontend especializado en Angular, PrimeNG y Tailwind CSS. Interfaces limpias, escalables y accesibles."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Script anti-parpadeo del tema antes del primer pintado -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio_theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('p-dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-page text-main antialiased selection:bg-blue-600 selection:text-white">
    <app-root></app-root>

    <!-- Formulario estático para detección de Netlify Forms -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
