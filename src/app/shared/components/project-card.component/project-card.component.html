<section
  class="flex flex-col justify-between bg-[#111216] border border-[#2a2b32] w-full h-full text-white overflow-hidden rounded-none shadow-xl transition-all duration-300 hover:border-cyan-500/50 group"
>
  <app-project-card-header [label]="project()?.header" />

  <a
    [routerLink]="['/projects', project()?.id]"
    class="w-full h-48 bg-[#0a0a0c] border-b border-[#2a2b32] overflow-hidden flex items-center justify-center relative cursor-pointer block"
  >
    @if (project()?.img) {
      <img
        [src]="project()?.img"
        [alt]="project()?.label"
        class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105"
      />
      <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
        <span class="bg-[#0a0a0c]/90 text-[#00f2fe] px-3 py-1.5 text-xs font-mono border border-[#00f2fe] flex items-center gap-1.5">
          <i class="pi pi-eye"></i> VER DETALLE
        </span>
      </div>
    } @else {
      <div class="text-gray-600 font-mono text-xs">NO_IMAGE</div>
    }
  </a>

  <div class="flex flex-col gap-3 p-4 flex-1">
    <h2 class="text-lg font-bold font-mono text-white flex items-center gap-2">
      <span class="text-[#00f2fe] font-bold">$</span>
      <a [routerLink]="['/projects', project()?.id]" class="hover:text-[#00f2fe] transition-colors">
        {{ project()?.label }}
      </a>
    </h2>

    <p class="text-sm text-red-200 font-sans leading-relaxed flex-1">
      {{ project()?.text_short }}
    </p>

    <div class="flex flex-wrap gap-2 my-2">
      @for (item of project()?.tech; track $index) {
        <app-badge [label]="item" color="#00f2fe"></app-badge>
      }
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3 p-4 pt-0 mt-auto">
    <a
      [routerLink]="['/projects', project()?.id]"
      class="w-full py-2 px-3 border border-[#00f2fe] text-[#00f2fe] font-mono text-xs font-bold uppercase tracking-wider text-center bg-[#00f2fe]/5 hover:bg-[#00f2fe]/20 transition-colors cursor-pointer block"
    >
      VER DETALLE
    </a>

    <a
      [href]="project()?.githubUrl ?? 'https://github.com/juanCabral-DJ'"
      target="_blank"
      class="w-full py-2 px-3 border border-[#3a3b45] text-[#ffaa77] font-mono text-xs font-bold uppercase tracking-wider text-center hover:bg-white/5 transition-colors cursor-pointer flex items-center justify-center gap-1"
    >
      <i class="pi pi-github text-xs"></i> SOURCE
    </a>
  </div>
</section>
